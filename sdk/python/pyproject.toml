[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exaconnect"
version = "0.1.0"
description = "Python SDK for ExaConnect, ExaCarib's connectivity platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["exaconnect"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = []
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
