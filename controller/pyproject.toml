[project]
name = "exaconnect-controller"
version = "0.2.0"
description = "ExaConnect controller: inventory, desired state, AI SLA routing, Storm Mode and metering."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "cryptography>=43",
  "webauthn>=2.0",  # passkeys (ADR 0017)
  "segno>=1.6",  # click-to-WhatsApp QR codes (ADR 0029)
  "ldap3>=2.9",  # directory sync over LDAPS (ADR 0036)
  "python-multipart>=0.0.9",  # file uploads (port documents, attachments, logos)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exaconnect_controller*"]

[tool.setuptools.package-data]
exaconnect_controller = ["schema.sql", "organisation.sql", "commai/sql/*.sql", "commai/static/*", "commai/i18n/*.json", "ai/fixtures/*.json", "ai/fixtures/*.xml",
                         "integrations/*.sql", "integrations/yang/*.yang", "integrations/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
