# ExaCarib box (ADR 0052): boot the kept slot, or try the other one once.
# exacarib-update sets `slot` and `try` in grubenv next to this file.
set timeout=2
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
load_env
if [ -z "$slot" ]; then set slot=A; fi
set boot=$slot
if [ -n "$try" ]; then
  set boot=$try
  set try=
  save_env try
fi
if ! search --no-floppy --label --set=sys exaroot-$boot; then
  set boot=$slot
  search --no-floppy --label --set=sys exaroot-$boot
fi
menuentry "ExaCarib box (slot $boot)" {
  linux ($sys)/vmlinuz root=LABEL=exaroot-$boot ro net.ifnames=0 biosdevname=0 console=tty0 console=ttyS0,115200n8 panic=10 exacarib.slot=$boot
  initrd ($sys)/initrd.img
}
