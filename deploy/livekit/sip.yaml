# LiveKit SIP bridge (ADR 0033). FreeSWITCH's "exacarib_ai" gateway sends calls
# for the AI agent here, and each call becomes a room called "call-<id>". The
# agent worker joins it. Only FreeSWITCH, on the compose network, reaches port 5062.
# API key and secret come from the environment (LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
ws_url: ws://livekit:7880
redis:
  address: livekit-redis:6379
sip_port: 5062
rtp_port: 10000-10100
use_external_ip: false
logging:
  level: info
