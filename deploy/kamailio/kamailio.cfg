#!KAMAILIO
#
# Jibsy by ExaCarib voice edge proxy (ADR 0033). Kamailio sits in front of
# FreeSWITCH: carriers talk only to Kamailio, and FreeSWITCH is never exposed.
#
#   carrier --(TLS or allow-listed IP)--> Kamailio --> FreeSWITCH   (inbound)
#   FreeSWITCH --> Kamailio --(dispatcher set per carrier, failover)--> carrier (outbound)
#
# - Allow-list: only carrier signalling addresses (address.list group 1, rendered
#   by the controller from the carriers) and FreeSWITCH (group 2) may send requests.
# - Rate limits: pike blocks a source sending too fast; a per-IP INVITE counter
#   caps new calls per minute.
# - TLS on 5061 (tls.cfg); certificates are mounted, never in the repo.
# - Routing: FreeSWITCH puts the carrier order from the controller's authorise
#   step in X-Exa-Route ("1,2": dispatcher set ids, see GET /voice-admin/kamailio);
#   failure_route tries the next set when a carrier refuses or times out.
# - Trunk health: the dispatcher sends SIP OPTIONS to every carrier every 30 s.
# - Calling platforms (ADR 0056): Teams Direct Routing, Zoom BYOC, Webex, Google Voice
#   and contact centres reach each organisation at its own SIP address under
#   PLATFORM_DOMAIN. A call from a platform's signalling address (address.list tag =
#   platform) to an address in platforms.list gets X-Exa-Link for FreeSWITCH. Calls to a
#   platform use the link's dispatcher set; platforms.list maps it ("set:<id>") to the
#   organisation's SIP address, which Kamailio presents in Record-Route and Contact (FreeSWITCH's own address rides in the
#   Contact's alias parameter, nathelper).
#
# Not run here: check it with `kamailio -c -f kamailio.cfg` on the voice host
# before first use. Set the addresses in kamailio-local.cfg (see README.md).

#!define FLT_CARRIER 1
#!define FLT_PBX 2
#!define FLT_PLATFORM 3
#!define FLT_PROTECTED 5

####### Global parameters #########

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=yes
children=4
auto_aliases=no
enable_tls=yes
tcp_connection_lifetime=3605

# PUBLIC_IP, PBX_ADDR, MAX_INVITES_PER_MIN come from kamailio-local.cfg
include_file "/etc/kamailio/kamailio-local.cfg"

# Every organisation's calling-platform SIP address is a subdomain of this (ADR 0056).
#!ifndef PLATFORM_DOMAIN
#!substdef "!PLATFORM_DOMAIN!sip.exacarib.com!g"
#!endif

listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tls:0.0.0.0:5061 advertise PUBLIC_IP:5061
#!ifdef WITH_PROTECTED_INGRESS
# Private mTLS socket: never add a host/public port publication for this.
listen=tls:PROTECTED_SBC_IP:5091
#!endif

####### Modules ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "kex.so"
loadmodule "tls.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "permissions.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"
loadmodule "nathelper.so"
loadmodule "corex.so"
loadmodule "ipops.so"

modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("tls", "xavp_cfg", "protected_tls")
# The organisations' calling-platform SIP addresses are this host (ADR 0056).
modparam("corex", "alias_subdomains", "tls:PLATFORM_DOMAIN:5061")
modparam("rr", "enable_full_lr", 1)

# A source sending more than 30 requests in 2 s is blocked for 5 minutes.
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 300)

# New calls per source address per minute.
modparam("htable", "htable", "invites=>size=10;autoexpire=60;updateexpire=0;")

# Allow-list rendered by the controller (address.list: group ip mask port tag).
modparam("permissions", "address_file", "/exacarib/kamailio/address.list")
modparam("permissions", "peer_tag_avp", "$avp(srctag)")

# Calling platforms: SIP address -> "platform:link key", loaded from platforms.list by start.sh.
modparam("htable", "htable", "platforms=>size=8;")
# Explicitly activated immutable protected ingress generation. No active pointer
# on startup: ordinary public.xml rejects protected DIDs until reviewed activation.
modparam("htable", "htable", "protectedin=>size=12;")
modparam("htable", "htable", "protectedtx=>size=12;autoexpire=3600;")
# Private operator-provisioned verifiers. Never rendered by the controller.
modparam("htable", "htable", "protectedauth=>size=8;")

# One dispatcher set per carrier, rendered by the controller (dispatcher.list).
modparam("dispatcher", "list_file", "/exacarib/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 3)
modparam("dispatcher", "ds_inactive_threshold", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=403;code=404;code=405")
modparam("dispatcher", "xavp_dst", "_dsdst_")
# Store alternate addresses for ds_next_dst(), and let the next carrier set
# replace the failed destination URI left by the preceding attempt.
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "force_dst", 1)

modparam("dialog", "dlg_flag", 4)

####### Routing logic ########

request_route {
	$var(in_failure) = 0;
	route(SANITY);

	if (!pike_check_req()) {
		xlog("L_WARN", "rate limit: $si blocked by pike\n");
		exit;
	}
	# Fail closed during activation or if the approved local bundle is damaged.
	# ACK/BYE/CANCEL still reach their dialog/transaction cleanup paths.
	if (!is_method("ACK|BYE|CANCEL") && $sht(protectedin=>gate) != "open") {
		sl_send_reply("503", "Voice policy activation unavailable");
		exit;
	}

	if ($Rp == 5091) {
		if ($proto != "tls" || $tls_peer_verified != 1 ||
				$tls_peer_subject_cn != "jibsy-pbx.internal" ||
				$sht(protectedin=>pbx_ip) == $null || $si != $sht(protectedin=>pbx_ip)) {
			sl_send_reply("403", "Private PBX identity required");
			exit;
		}
		setflag(FLT_PBX);
	} else if (route(APPROVED_SOURCE)) {
		setflag(FLT_CARRIER);
	} else if (allow_source_address("1")) {
		setflag(FLT_CARRIER);
	} else if (allow_source_address("2")) {
		setflag(FLT_PBX);
	} else {
		xlog("L_NOTICE", "refused $rm from $si: not on the allow-list\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	if (is_method("OPTIONS") && uri==myself) {
		sl_send_reply("200", "OK");
		exit;
	}

	# Only Kamailio says which calling-platform link a call came in on.
	remove_hf("X-Exa-Link");
	# Remove every occurrence, including differently cased duplicates. Neither
	# Via nor a caller assertion can attest the external transport.
	remove_hf_re("^[xX]-[eE][xX][aA]-[iI][nN][gG][rR][eE][sS][sS]-");
	$var(media_count) = $hdrc(X-Exa-Media-Policy);
	$var(media_policy) = $hdr(X-Exa-Media-Policy);
	$var(route_count) = $hdrc(X-Exa-Route);
	$var(route_header) = $hdr(X-Exa-Route);
	$var(origin_count) = $hdrc(X-Jibsy-Trunk-Token);
	$var(origin_hash) = "-";
	if ($var(origin_count) == 1 && $hdr(X-Jibsy-Trunk-Token) =~ "^[0-9a-f]{64}$") {
		$var(origin_hash) = $(hdr(X-Jibsy-Trunk-Token){s.sha256});
	}
	# Capture initial PBX routing metadata, then strip on every path, including
	# in-dialog requests. A caller never forwards a private assertion downstream.
	remove_hf("X-Exa-Media-Policy");
	remove_hf("X-Exa-Route");
	remove_hf("X-Jibsy-Trunk-Token");
	route(PROTECTED_TX_GUARD);

	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_lookup_cancel()) {
			# Inspect the actual matched INVITE, not caller-reconstructed keys.
			if ($T_inv($mf) & 32) {
				if ($proto != "tls" || $si != $T_inv($si) ||
						($T_inv($Rp) == 5091 &&
						 ($Rp != 5091 || $tls_peer_verified != 1 ||
						  $tls_peer_subject_cn != "jibsy-pbx.internal"))) {
					sl_send_reply("403", "Protected CANCEL requires original authenticated peer");
					exit;
				}
			}
			t_relay();
		}
		exit;
	}

	# Retransmitting an initial INVITE is the same call, not another call
	# against the per-minute cap or another dialog to route.
	if (t_check_trans()) {
		exit;
	}

	if (is_method("INVITE")) {
		route(CALLCAP);
	}

	remove_hf("Route");

	if (isflagset(FLT_CARRIER)) {
		remove_hf("X-Exa-Route");
		if (is_method("INVITE")) {
			route(PROTECTED_IN);
			dlg_manage();
			route(PLATFORM_IN);
		}
		if (is_method("INVITE|SUBSCRIBE") && !isflagset(FLT_PLATFORM)) {
			record_route();
		}
		route(TO_PBX);
	}
	route(TO_CARRIER);
}

route[PROTECTED_TX_GUARD] {
	# TM's non-replying lookup supplies its internal transaction identity.
	# Never recreate transaction matching from caller Via/header attributes.
	$var(dlgraw) = "d:" + $(ci{s.len}) + ":" + $ci + ":" + $(ft{s.len}) + ":" + $ft;
	$var(dlgkey) = $(var(dlgraw){s.md5});
	if (!is_method("CANCEL") && t_lookup_request()) {
		$var(txkey) = "t:" + $T(id_index) + ":" + $T(id_label);
		# Run before t_check_trans: even a copied retransmission must not
		# obtain cached SDP/keying replies through an untrusted transport.
		if ($sht(protectedtx=>$var(txkey)) == "pbx") {
			if ($Rp != 5091 || $proto != "tls" || $tls_peer_verified != 1 ||
					$tls_peer_subject_cn != "jibsy-pbx.internal" || $si != $sht(protectedin=>pbx_ip)) {
				sl_send_reply("403", "Protected transaction requires private PBX identity");
				exit;
			}
		} else if ($sht(protectedtx=>$var(txkey)) != $null &&
				($proto != "tls" || !is_in_subnet("$si", "$sht(protectedtx=>$var(txkey))"))) {
			sl_send_reply("403", "Protected transaction requires authorised TLS");
			exit;
		}
		if ($sht(protectedtx=>$var(txkey)) != $null && $sht(protectedtx=>$var(txkey)) != "pbx") {
			$var(txsetkey) = $var(txkey) + ":set";
			$var(authset) = $sht(protectedtx=>$var(txsetkey));
			route(PROTECTED_ORIGIN_AUTH);
		}
	} else if (!has_totag() && is_method("INVITE") && $sht(protectedtx=>$var(dlgkey)) != $null) {
		sl_send_reply("403", "Protected dialog identity already in use");
		exit;
	}
}

route[RESERVE_PROTECTED_TX] {
	# Only one initial protected transaction may own this early dialog ID.
	# Lock before dlg_manage so parallel distinct-branch copies cannot replace
	# the first call's carrier/private-peer continuity policy.
	sht_lock("protectedtx=>$var(dlgkey)");
	if ($sht(protectedtx=>$var(dlgkey)) != $null) {
		sht_unlock("protectedtx=>$var(dlgkey)");
		sl_send_reply("403", "Protected dialog identity already in use");
		exit;
	}
	$sht(protectedtx=>$var(dlgkey)) = "bound";
	setflag(FLT_PROTECTED);
	if (!t_newtran()) {
		sht_unlock("protectedtx=>$var(dlgkey)");
		exit;
	}
	$var(txkey) = "t:" + $T(id_index) + ":" + $T(id_label);
	$sht(protectedtx=>$var(txkey)) = $var(txpolicy);
	$var(txsetkey) = $var(txkey) + ":set";
	$sht(protectedtx=>$var(txsetkey)) = $var(authset);
	sht_unlock("protectedtx=>$var(dlgkey)");
	dlg_manage();
}

route[PROTECTED_ORIGIN_AUTH] {
	# A shared provider CIDR/DID is not proof of this customer's trunk account.
	# Store only an operator-private, per-set domain-separated verifier.
	$var(authkey) = "set:" + $var(authset);
	if ($var(origin_count) != 1 || $var(origin_hash) == "-" ||
			$sht(protectedauth=>$var(authkey)) == $null) {
		sl_send_reply("403", "Protected trunk origin authentication required");
		exit;
	}
	$var(authclaim) = "jibsy-origin-v1:" + $var(authset) + ":" + $var(origin_hash);
	if ($(var(authclaim){s.sha256}) != $sht(protectedauth=>$var(authkey))) {
		sl_send_reply("403", "Protected trunk origin authentication failed");
		exit;
	}
}

# The approved immutable CIDR groups are independent of candidate address.list
# reloads. This preserves a protected call's reviewed source policy.
route[APPROVED_SOURCE] {
	if (has_totag() && is_known_dlg() && $dlg_var(psources) != $null) {
		if (is_in_subnet("$si", "$dlg_var(psources)")) {
			return 1;
		}
	}
	if (has_totag() && is_known_dlg() && $dlg_var(out_sources) != $null) {
		if (is_in_subnet("$si", "$dlg_var(out_sources)")) {
			return 1;
		}
	}
	if ($rU =~ "^[+]?[1-9][0-9]{6,14}$" && $sht(protectedin=>active) != $null) {
		$var(akey) = $sht(protectedin=>active) + ":" + "+" + $(rU{re.subst,/^[+]//});
		if ($sht(protectedin=>$var(akey)) != $null) {
			$var(apolicy) = $sht(protectedin=>$var(akey));
			$var(agroup) = $(var(apolicy){s.select,0,:});
			$var(aclkey) = $sht(protectedin=>active) + ":acl:" + $var(agroup);
			if ($sht(protectedin=>$var(aclkey)) != $null &&
					is_in_subnet("$si", "$sht(protectedin=>$var(aclkey))")) {
				return 1;
			}
		}
	}
	return -1;
}

# Initial protected DID classification is controller-owned, never a SIP header.
# Non-active/missing policy falls into ordinary public.xml, whose protected-DID
# rejection and approved local owned routes both fail closed.
route[PROTECTED_IN] {
	if (!($rU =~ "^[+]?[1-9][0-9]{6,14}$") ||
			$sht(protectedin=>active) == $null || $sht(protectedin=>active) == "-") {
		return;
	}
	$var(pdid) = "+" + $(rU{re.subst,/^[+]//});
	$var(pkey) = $sht(protectedin=>active) + ":" + $var(pdid);
	if ($sht(protectedin=>$var(pkey)) == $null) {
		return;
	}
	$var(ppolicy) = $sht(protectedin=>$var(pkey));
	$var(pgroup) = $(var(ppolicy){s.select,0,:});
	$var(prev) = $(var(ppolicy){s.select,1,:});
	if ($var(prev) == "LEGACY") {
		return;
	}
	$var(paclkey) = $sht(protectedin=>active) + ":acl:" + $var(pgroup);
	if ($proto != "tls" || $var(pgroup) == "0" ||
			$sht(protectedin=>$var(paclkey)) == $null ||
			!is_in_subnet("$si", "$sht(protectedin=>$var(paclkey))")) {
		sl_send_reply("403", "Protected ingress requires authorised TLS");
		exit;
	}
	$var(authset) = $(var(ppolicy){s.select,2,:});
	route(PROTECTED_ORIGIN_AUTH);
	$var(txpolicy) = $sht(protectedin=>$var(paclkey));
	route(RESERVE_PROTECTED_TX);
	$dlg_var(pgroup) = $var(pgroup);
	$dlg_var(prev) = $var(prev);
	$dlg_var(pdid) = $var(pdid);
	$dlg_var(psources) = $sht(protectedin=>$var(paclkey));
	# The destination is a dedicated TLS-only, mutual-authentication profile.
	# A missing private TLS domain/certificate cannot fall back to public UDP.
	if ($sht(protectedin=>pbx_uri) == $null || $sht(protectedin=>sbc_route) == $null) {
		sl_send_reply("503", "Protected ingress unavailable");
		exit;
	}
	$du = $sht(protectedin=>pbx_uri);
	$dlg_var(ppbx_uri) = $du;
	$dlg_var(ppbx_ip) = $sht(protectedin=>pbx_ip);
	$xavp(protected_tls=>server_id) = "protected-pbx";
	$fs = "tls:" + $sht(protectedin=>sbc_ip) + ":5091";
	append_hf("X-Exa-Ingress-Policy: $var(prev)\r\n");
	t_on_reply("PROTECTED_REPLY");
	record_route_preset("$sht(protectedin=>sbc_route)", "PUBLIC_IP:5061;transport=tls;r2=on");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

onreply_route[PROTECTED_REPLY] {
	# Received replies need their own wire identity checks; request_route does
	# not run for responses, even when a forged Via matches a transaction.
	if (isflagset(FLT_PBX)) {
		if ($dlg_var(out_tls) == "1") {
			$var(reply_sources) = $dlg_var(out_sources);
		} else {
			$var(reply_sources) = $dlg_var(psources);
		}
		if ($proto != "tls" || !is_in_subnet("$si", "$var(reply_sources)")) {
			drop;
		}
	} else if ($proto != "tls" || $tls_peer_verified != 1 ||
			$tls_peer_subject_cn != "jibsy-pbx.internal" ||
			($si != $dlg_var(ppbx_ip) && $si != $dlg_var(out_pbx_ip))) {
		drop;
	}
}

# A call from a calling platform to an organisation's SIP address: it must come from that
# platform's signalling addresses. FreeSWITCH learns the link from X-Exa-Link.
route[PLATFORM_IN] {
	$var(host) = $(rd{s.tolower});
	# ($var keeps a value between messages and turns $null into 0: test the table itself.)
	if ($sht(platforms=>$var(host)) == $null) {
		return;
	}
	$var(p) = $sht(platforms=>$var(host));
	if ($(var(p){s.select,0,:}) != $avp(srctag)) {
		xlog("L_NOTICE", "refused $rm to $rd from $si: not from that platform\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	append_hf("X-Exa-Link: $(var(p){s.select,1,:})\r\n");
	$dlg_var(pfqdn) = $var(host);
	setflag(FLT_PLATFORM);
	# Both sides of Kamailio in Record-Route: the platform reaches the organisation's SIP address.
	record_route_preset("PUBLIC_IP:5060;r2=on", "$var(host):5061;transport=tls;r2=on");
	t_on_reply("PLATFORM_REPLY");
}

# FreeSWITCH's Contact as the platform must see it: the organisation's SIP address, with
# FreeSWITCH's own address in the alias parameter for requests coming back ($var(fqdn) set).
route[PLATFORM_CONTACT] {
	if (!is_present_hf("Contact")) {
		return;
	}
	$var(user) = $(ct{nameaddr.uri}{uri.user});
	remove_hf("Contact");
	insert_hf("Contact: <sip:$var(user)@$var(fqdn):5061;transport=tls;alias=$si~$sp~1>\r\n", "CSeq");
}

# Answers from FreeSWITCH to a platform's call.
onreply_route[PLATFORM_REPLY] {
	if (!isflagset(FLT_PBX) && $dlg_var(pfqdn) != $null && allow_source_address("2")) {
		$var(fqdn) = $dlg_var(pfqdn);
		route(PLATFORM_CONTACT);
	}
}

# OPTIONS keep-alives to Microsoft carry ExaCarib's SIP domain (Teams' carrier hosting model).
event_route[tm:local-request] {
	if (is_method("OPTIONS") && $rd =~ "pstnhub\.microsoft\.com$") {
		append_hf("Contact: <sip:PLATFORM_DOMAIN:5061;transport=tls>\r\n");
	}
}

route[SANITY] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		exit;
	}
}

# At most MAX_INVITES_PER_MIN new calls a minute from one address.
route[CALLCAP] {
	# Several SIP workers share this counter. Do not lose simultaneous calls
	# or extend the one-minute window each time another call arrives.
	sht_lock("invites=>$si");
	$var(n) = $sht(invites=>$si);
	if ($var(n) == $null) {
		$var(n) = 0;
	}
	$var(n) = $var(n) + 1;
	$sht(invites=>$si) = $var(n);
	sht_unlock("invites=>$si");
	if ($var(n) > MAX_INVITES_PER_MIN) {
		xlog("L_WARN", "rate limit: $si over MAX_INVITES_PER_MIN calls a minute\n");
		sl_send_reply("503", "Rate limited");
		exit;
	}
}

route[WITHINDLG] {
	# A non-2xx ACK belongs to the INVITE transaction, not an established dialog.
	if (is_method("ACK")) {
		t_check_trans();
	}
	# Neither an arbitrary To-tag nor a Contact alias authorises a new route.
	# Check before consuming the alias or any caller-supplied Route header.
	if (!is_known_dlg()) {
		if (!is_method("ACK")) {
			sl_send_reply("481", "Call/Transaction Does Not Exist");
		}
		exit;
	}
	if ($dlg_var(prev) != $null) {
		# Stored call state pins the carrier source group even if another
		# allow-listed carrier learns the Call-ID/tags. No public downgrade.
		if (isflagset(FLT_PBX)) {
			if ($Rp != 5091 || $proto != "tls" || $tls_peer_verified != 1 ||
					$tls_peer_subject_cn != "jibsy-pbx.internal" || $si != $dlg_var(ppbx_ip)) {
				if (!is_method("ACK")) {
					sl_send_reply("403", "Protected private PBX identity required");
				}
				exit;
			}
		} else {
			if ($proto != "tls" || !is_in_subnet("$si", "$dlg_var(psources)")) {
				if (!is_method("ACK")) {
					sl_send_reply("403", "Protected dialog requires authorised TLS");
				}
				exit;
			}
			append_hf("X-Exa-Ingress-Policy: $dlg_var(prev)\r\n");
		}
	}
	if ($dlg_var(out_tls) == "1") {
		if (isflagset(FLT_PBX)) {
			if ($Rp != 5091 || $proto != "tls" || $tls_peer_verified != 1 ||
					$tls_peer_subject_cn != "jibsy-pbx.internal" || $si != $dlg_var(out_pbx_ip)) {
				if (!is_method("ACK")) {
					sl_send_reply("403", "Protected private PBX identity required");
				}
				exit;
			}
		} else if ($proto != "tls" || !is_in_subnet("$si", "$dlg_var(out_sources)")) {
			if (!is_method("ACK")) {
				sl_send_reply("403", "Protected carrier dialog requires authorised TLS");
			}
			exit;
		}
	}
	# Back to FreeSWITCH from a calling platform: its address is in the alias parameter of a
	# Contact on the organisation's SIP address, which is this host. Put FreeSWITCH's address
	# in the request URI first, so loose_route doesn't take it for strict routing.
	if ($dlg_var(prev) == $null && $dlg_var(out_tls) == $null && $ru =~ ";alias=") {
		handle_ruri_alias();
		if ($rU != $null) {
			$ru = "sip:" + $rU + "@" + $(du{uri.host}) + ":" + $(du{uri.port});
		} else {
			$ru = "sip:" + $(du{uri.host}) + ":" + $(du{uri.port});
		}
	}
	if (loose_route()) {
		if ($dlg_var(prev) != $null || $dlg_var(out_tls) == "1") {
			t_on_reply("PROTECTED_REPLY");
		}
		if ($dlg_var(out_tls) == "1") {
			if (isflagset(FLT_PBX)) {
				$du = $dlg_var(out_carrier_uri);
			} else {
				$du = $dlg_var(out_pbx_uri);
				$xavp(protected_tls=>server_id) = "protected-pbx";
				$fs = "tls:" + $sht(protectedin=>sbc_ip) + ":5091";
			}
		}
		if ($dlg_var(prev) != $null) {
			if (!isflagset(FLT_PBX)) {
				$du = $dlg_var(ppbx_uri);
				$xavp(protected_tls=>server_id) = "protected-pbx";
				$fs = "tls:" + $sht(protectedin=>sbc_ip) + ":5091";
			} else if (($du != $null && $dP != "tls") ||
					($du == $null && $rP != "tls")) {
				if (!is_method("ACK")) {
					sl_send_reply("403", "Protected carrier dialog requires TLS");
				}
				exit;
			}
		}
		if ($dlg_var(pfqdn) != $null) {
			if (isflagset(FLT_PBX)) {
				$var(fqdn) = $dlg_var(pfqdn);
				route(PLATFORM_CONTACT);
			} else {
				t_on_reply("PLATFORM_REPLY");
			}
		}
		t_relay();
		exit;
	}
	if (is_method("ACK") && t_check_trans()) {
		t_relay();
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

event_route[htable:mod-init] {
	$sht(protectedin=>gate) = "closed";
	# Optional private file has only root-provisioned hash assignments.
	# Absent file leaves protected inbound closed; no ready/env override.
	import_file "/etc/kamailio/private-origination-auth.cfg"
}

# Inbound: carrier -> FreeSWITCH. The number dialled stays in the R-URI.
route[TO_PBX] {
	$du = "sip:PBX_ADDR";
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# Outbound: FreeSWITCH -> carriers, in the order the controller chose.
route[TO_CARRIER] {
	# This originates only on the PBX carrier B-leg, after signed admission.
	# Never send the private policy assertion to a carrier.
	$avp(require_tls) = 0;
	if ($var(media_count) > 0) {
		if ($Rp != 5091 || $proto != "tls" ||
				$var(media_count) != 1 ||
				$var(media_policy) != "SRTP_REQUIRED") {
			sl_send_reply("503", "Invalid carrier media policy");
			exit;
		}
		$avp(require_tls) = 1;
	} else if ($Rp == 5091) {
		sl_send_reply("503", "Private carrier media policy required");
		exit;
	}
	# Only the PBX's controller-authorised set list may choose an outbound
	# carrier. A missing route must never silently use another tenant's set 1.
	if ($var(route_count) != 1 ||
			!($var(route_header) =~ "^[1-9][0-9]*(,[1-9][0-9]*)*$")) {
		sl_send_reply("503", "No authorised carrier route");
		exit;
	}
	$avp(route) = $var(route_header);
	if ($avp(require_tls) == 1) {
		$var(txpolicy) = "pbx";
		$var(authset) = 0;
		route(RESERVE_PROTECTED_TX);
		$dlg_var(out_tls) = "1";
		$dlg_var(out_pbx_ip) = $si;
		$dlg_var(out_pbx_uri) = $sht(protectedin=>pbx_uri);
		t_on_reply("PROTECTED_REPLY");
	} else if (is_method("INVITE")) {
		dlg_manage();
	}
	if (!route(NEXT_CARRIER)) {
		sl_send_reply("503", "No carrier available");
		exit;
	}
	# A calling platform's set has the organisation's SIP address (platforms.list, "set:<id>").
	if (is_method("INVITE|SUBSCRIBE")) {
		if ($avp(require_tls) == 1) {
			record_route_preset("PUBLIC_IP:5061;transport=tls;r2=on", "$sht(protectedin=>sbc_route)");
		} else if ($sht(platforms=>set:$var(set)) != $null) {
			$var(fqdn) = $sht(platforms=>set:$var(set));
			$dlg_var(pfqdn) = $var(fqdn);
			record_route_preset("$var(fqdn):5061;transport=tls;r2=on", "PUBLIC_IP:5060;r2=on");
			route(PLATFORM_CONTACT);
		} else {
			record_route();
		}
	}
	t_on_failure("CARRIER_FAILED");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# Take the next dispatcher set id off the list and pick a live destination in it.
route[NEXT_CARRIER] {
	while ($avp(route) != "") {
		$var(set) = $(avp(route){s.select,0,,});
		if ($(avp(route){s.count,,}) > 0) {
			$avp(route) = $(avp(route){s.substr,$(var(set){s.len}),0});
			$avp(route) = $(avp(route){s.substr,1,0});
		} else {
			$avp(route) = "";
		}
		if ($avp(require_tls) == 1) {
			# Protected destinations come from the approved immutable generation,
			# never a mutable candidate dispatcher reload or its health state.
			$avp(selected_set) = $var(set);
			$var(odestination) = $sht(protectedin=>active) + ":destination:" + $var(set);
			if ($sht(protectedin=>$var(odestination)) == $null) {
				route(CARRIER_SET_POLICY);
				exit;
			}
			$du = $sht(protectedin=>$var(odestination));
			route(CARRIER_SET_POLICY);
			return 1;
		}
		if (ds_select_dst("$(var(set){s.int})", "8")) {
			$avp(selected_set) = $var(set);
			route(CARRIER_SET_POLICY);
			xlog("L_INFO", "call $ci via carrier set $var(set) ($du)\n");
			return 1;
		}
	}
	return -1;
}

route[CARRIER_SET_POLICY] {
	$var(osetkey) = $sht(protectedin=>active) + ":set:" + $avp(selected_set);
	# A forged X-Exa-Route on the broad legacy PBX subnet cannot select a
	# protected set. Both the authenticated private leg and policy are required.
	if ($avp(require_tls) != 1) {
		if ($sht(protectedin=>$var(osetkey)) != $null) {
			if ($var(in_failure) == 1) {
				t_reply("503", "Protected carrier requires private PBX authentication");
			} else {
				sl_send_reply("503", "Protected carrier requires private PBX authentication");
			}
			exit;
		}
		return;
	}
	if ($dP != "tls") {
		if ($var(in_failure) == 1) {
			t_reply("503", "Protected carrier requires TLS");
		} else {
			sl_send_reply("503", "Protected carrier requires TLS");
		}
		exit;
	}
	$var(odestination) = $sht(protectedin=>active) + ":destination:" + $avp(selected_set);
	if ($sht(protectedin=>$var(odestination)) == $null ||
			$du != $sht(protectedin=>$var(odestination))) {
		if ($var(in_failure) == 1) {
			t_reply("503", "Protected carrier destination differs from approval");
		} else {
			sl_send_reply("503", "Protected carrier destination differs from approval");
		}
		exit;
	}
	if ($sht(protectedin=>$var(osetkey)) == $null) {
		if ($var(in_failure) == 1) {
			t_reply("503", "Carrier has no approved protected source policy");
		} else {
			sl_send_reply("503", "Carrier has no approved protected source policy");
		}
		exit;
	}
	$var(oaclkey) = $sht(protectedin=>active) + ":acl:" + $sht(protectedin=>$var(osetkey));
	if ($sht(protectedin=>$var(oaclkey)) == $null) {
		if ($var(in_failure) == 1) {
			t_reply("503", "Carrier source policy unavailable");
		} else {
			sl_send_reply("503", "Carrier source policy unavailable");
		}
		exit;
	}
	$dlg_var(out_sources) = $sht(protectedin=>$var(oaclkey));
	$dlg_var(out_carrier_uri) = $du;
}

failure_route[CARRIER_FAILED] {
	$var(in_failure) = 1;
	if (t_is_canceled()) {
		exit;
	}
	# Busy or the caller's fault: tell FreeSWITCH, don't try another carrier.
	if (t_check_status("486|600|603|404|484")) {
		exit;
	}
	# Another address of the same carrier (Microsoft has three), then the next carrier.
	if ($avp(require_tls) != 1 && ds_next_dst()) {
		route(CARRIER_SET_POLICY);
		t_on_failure("CARRIER_FAILED");
		t_relay();
		exit;
	}
	if (route(NEXT_CARRIER)) {
		t_on_failure("CARRIER_FAILED");
		t_relay();
	}
}
