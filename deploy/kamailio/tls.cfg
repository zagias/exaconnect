# Kamailio TLS (port 5061). The certificate and key are mounted from the host
# into /etc/kamailio/tls and are never committed. Carriers that offer TLS are
# verified against the system CA bundle.

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/server.key
certificate = /etc/kamailio/tls/server.crt

[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
ca_list = /etc/ssl/certs/ca-certificates.crt
